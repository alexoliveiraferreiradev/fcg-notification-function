name: Construir e implantar o aplicativo .NET Core para o Aplicativo de Função fcg-notification-function
on:
  push:
    branches:
    - main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  AZURE_FUNCTIONAPP_NAME: fcg-notification-function
  AZURE_FUNCTIONAPP_PACKAGE_PATH: published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: src/Fcg.Notification.Functions
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Test
      run: dotnet test Fcg.Notification.Function.slnx --configuration ${{ env.CONFIGURATION }}
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --output "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: functionapp
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        include-hidden-files: true
  deploy:
    environment: fcg_notification_function_Env
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: functionapp
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.fcg_notification_function_CLIENT_ID_6C2A }}
        tenant-id: ${{ vars.fcg_notification_function_TENANT_ID_6C2A }}
        subscription-id: ${{ vars.fcg_notification_function_SUBSCRIPTION_ID_6C2A }}
    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
